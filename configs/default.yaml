seed: 42
n_runs: 10

network:
  n_nodes: 1000                               # N
  n_layers: 5                                 # L
  n_affiliations: [25, 50, 100, 200, 400]             # K_l
  layer_labels: ['l1', 'l2', 'l3', 'l4', 'l5']

metric_space:                                 # S
  square_side: 1
  distance: euclidean                         # d
  toroidal: False

embedding:
  nodes: uniform                              # X_V
  affiliations: uniform                       # X_A

connection:
  function: exponential_decay                 # gamma
  alpha: 0.01

visualization:
  plot_network: true
  plot_degree_distribution: true
  show: False

analysis:
  omega_lookup_res: 101
  mc_n_trials: 1000
  trapezoidal_res: 101
    

output:
  plots:
    degree_dist: true
    degree_dist_layers: true
    embededness: true
    network_visualization: true
    save: true
    show: false
