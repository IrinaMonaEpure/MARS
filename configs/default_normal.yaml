seed: 42
n_runs: 10

network:
  n_nodes: 1000                               # N
  n_layers: 6                                 # L
  n_affiliations: [350, 300, 250, 200, 150, 100]             # K_l
  layer_labels: ['L1', 'L2', 'L3', 'L4', 'L5', 'L6']

metric_space:                                 # S
  square_side: 1
  distance: euclidean                         # d
  toroidal: False

embedding:
  nodes: normal                              # X_V
  affiliations: uniform                       # X_A
  std: 0.2

connection:
  function: exponential_decay                 # gamma
  alpha: 0.01

visualization:
  plot_network: true
  plot_degree_distribution: true
  show: False

output:
  plots:
    degree_dist: true
    degree_dist_layers: true
    embededness: true
    network_visualization: true
    save: true
    show: false